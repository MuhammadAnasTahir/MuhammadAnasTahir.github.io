<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <!-- Gradient for the light green left mountain -->
    <linearGradient id="lgGreen" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#C8EE72"/>
      <stop offset="55%"  stop-color="#8DC640"/>
      <stop offset="100%" stop-color="#4A9920"/>
    </linearGradient>
    <!-- Inner glow highlight where mountains meet -->
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#EEFAAA"/>
      <stop offset="100%" stop-color="#C8EE72" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark green mountain (back-left) -->
  <polygon points="60,285 152,42 244,285" fill="#006B35"/>

  <!-- Light green mountain (front-left) -->
  <polygon points="10,285 130,18 230,285" fill="url(#lgGreen)"/>

  <!-- Inner centre glow highlight -->
  <polygon points="118,285 150,60 182,285" fill="url(#glow)"/>

  <!-- Navy blue mountain (right) -->
  <polygon points="140,285 228,42 298,285" fill="#003087"/>
</svg>
